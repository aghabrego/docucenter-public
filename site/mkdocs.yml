site_name: DocuCenter
site_description: Documentación técnica y de usuario de DocuCenter - Sistema de facturación electrónica
site_author: aghabrego
site_url: https://aghabrego.github.io/docucenter/
repo_url: https://github.com/aghabrego/docucenter
repo_name: aghabrego/docucenter

theme:
  name: material
  language: es
  favicon: https://home.apconpanama.me/wp-content/uploads/2024/03/logo3.png
  logo: https://home.apconpanama.me/wp-content/uploads/2024/03/logo3.png
  palette:
    - scheme: default
      primary: blue
      accent: light blue
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest

nav:
  - Inicio: index.md
  - APIs:
    - api/index.md
    - Facturación Electrónica (FE):
      - api/fe/fe-api.md
      - api/fe/acicloud-fe-api.md
      - api/fe/document-emission-api.md
      - api/fe/shopify-api.md
      - api/fe/lightspeed-api.md
      - api/fe/maxgym-api.md
      - api/fe/meypar-api.md
      - api/fe/kart21-api.md
    - Sage ACICloud:
      - api/sage-acicloud/customers-api.md
      - api/sage-acicloud/products-api.md
      - api/sage-acicloud/sales-orders-api.md
      - api/sage-acicloud/purchases-api.md
      - api/sage-acicloud/payments-api.md
      - api/sage-acicloud/inventory-api.md
      - api/sage-acicloud/jobs-api.md
    - Organizaciones:
      - api/organizations/organizations-api.md
  - Optimizaciones:
    - optimizations/README.md
    - Performance:
      - optimizations/customer-supplier-optimizations.md
      - optimizations/mysql-optimization-circuit-breaker.md
  - Documentación Técnica:
    - technical/README.md
    - Pagos y Cálculos:
      - technical/payment-calculation-fix.md
      - technical/solucion-sincronizacion-pagos.md
  - Validaciones:
    - validations/README.md
    - Documentos Fiscales:
      - validations/createSale-ruc-validation.md
      - validations/maxgym-ruc-validation.md

markdown_extensions:
  - admonition
  - attr_list
  - codehilite:
      guess_lang: false
  - toc:
      permalink: true
  - footnotes
  - pymdownx.arithmatex
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/aghabrego/docucenter
